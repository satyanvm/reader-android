# Cloudflare Worker + D1 for the Reader sync server. Deploy: npm run deploy
name = "reader-sync"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "reader"
database_id = "8398bf6b-bcf3-4403-820c-db10d88a9483"

# Book files are kept in the D1 database above. To keep them in R2 instead (needs R2 enabled on
# the account), create a bucket with `npx wrangler r2 bucket create reader-books` and uncomment:
# [[r2_buckets]]
# binding = "BOOKS"
# bucket_name = "reader-books"

[vars]
# Comma-separated. Empty turns that sign-in off.
GOOGLE_CLIENT_IDS = ""
APPLE_AUDIENCES = ""
MAIL_FROM = "Reader <onboarding@resend.dev>"
# "1": new email + password accounts confirm the address with an emailed code, and
# "Forgot password?" works. Anything else: no code, sign-up signs in at once (until mail is set up).
EMAIL_CODES = ""
# Lemon Squeezy share links of the Pro variants (README: Payments). Empty: that plan shows "Coming soon".
LEMONSQUEEZY_CHECKOUT_MONTHLY = ""
LEMONSQUEEZY_CHECKOUT_YEARLY = ""

# Secrets (not in this file): `npx wrangler secret put <NAME>`
#   PASSWORD_PEPPER  required: random secret mixed into password hashes; never change it
#   RESEND_API_KEY   optional: send code emails; without it codes only appear in `npx wrangler tail`
#   LEMONSQUEEZY_WEBHOOK_SECRET  optional: the signing secret of the Lemon Squeezy webhook; turns on payments

[observability]
enabled = true
